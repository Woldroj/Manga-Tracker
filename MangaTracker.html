<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manga Tracker</title>
  <style>
    :root{
      --bg:#1f2937; --card:#374151; --muted:#9ca3af; --accent:#f9fafb;
      --accent-2:#3b82f6; --danger:#ef4444; --glass: rgba(255,255,255,0.1);
      font-synthesis: none;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;color:var(--accent);background:var(--bg);}

    .app{max-width:1100px;margin:28px auto;padding:18px}
    header{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;text-align:center}
    header h1{font-size:32px;margin:0 0 6px}
    header p{color:var(--muted);margin:0;font-size:16px}

    .controls{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
    .btn{background:var(--accent);color:var(--bg);border:none;padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
    .btn.primary{background:var(--accent-2);color:white;border:none}
    .btn.ghost{background:transparent;color:var(--accent-2);border:1px solid var(--accent-2)}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:20px}
    .card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:8px;min-height:180px}
    .card .top{display:flex;gap:10px}
    .thumb{width:68px;height:92px;border-radius:6px;background:linear-gradient(90deg,#6b7280,#374151);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .meta{flex:1}
    .title{font-weight:700;font-size:17px;margin:0}
    .genre{font-size:13px;color:var(--muted);margin-top:4px}
    .last{margin-top:8px;font-size:14px}
    .actions{display:flex;gap:8px;margin-top:auto;align-items:center}
    .link{font-size:13px;color:var(--accent-2);text-decoration:none;margin-right:auto}
    .small{font-size:12px;padding:6px 8px;border-radius:8px;border:none;cursor:pointer}

    /* form modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);padding:20px}
    .modal.open{display:flex}
    .panel{width:100%;max-width:560px;background:var(--card);border-radius:12px;padding:16px}
    .form-row{display:flex;gap:8px;margin-bottom:10px}
    .form-row .col{flex:1}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type=text],select,input[type=url],input[type=number],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);font-size:14px;background:var(--bg);color:var(--accent)}
    textarea{resize:vertical;min-height:70px}

    .uploader{display:flex;gap:8px;align-items:center}
    .uploader input[type=file]{display:none}
    .fakefile{padding:8px 10px;border-radius:8px;border:1px dashed rgba(255,255,255,0.3);cursor:pointer;font-size:13px;color:var(--muted)}

    @media (max-width:520px){.form-row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Manga Tracker</h1>
      <p>Registra tus mangas y capítulos leídos</p>
      <div class="controls">
        <button id="btn-export" class="btn">Exportar</button>
        <button id="btn-import" class="btn">Importar</button>
        <button id="btn-add" class="btn primary">＋ Añadir manga</button>
      </div>
    </header>

    <main>
      <section class="grid" id="grid"></section>
      <p id="empty" style="color:var(--muted);text-align:center;">No hay mangas. Pulsa <strong>＋ Añadir manga</strong> para crear uno.</p>
    </main>
  </div>

  <!-- Modal formulario -->
  <div class="modal" id="modal">
    <div class="panel">
      <h3 id="form-title">Añadir manga</h3>
      <div style="margin-top:10px">
        <div class="form-row">
          <div class="col">
            <label for="title">Título</label>
            <input id="title" type="text" placeholder="Ej: One Piece" />
          </div>
          <div class="col">
            <label for="genre">Género</label>
            <select id="genre">
              <option value="Acción">Acción</option>
              <option value="Aventura">Aventura</option>
              <option value="Comedia">Comedia</option>
              <option value="Drama">Drama</option>
              <option value="Fantasía">Fantasía</option>
              <option value="Romance">Romance</option>
              <option value="Erótico">Erótico</option>
              <option value="Seinen">Seinen</option>
              <option value="Shonen">Shonen</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="col">
            <label for="last">Último capítulo visto</label>
            <input id="last" type="text" placeholder="Ej: 120" />
          </div>
          <div class="col">
            <label for="url">Enlace al manga</label>
            <input id="url" type="url" placeholder="https://..." />
          </div>
        </div>

        <div style="margin-bottom:10px">
          <label for="notes">Notas (opcional)</label>
          <textarea id="notes" placeholder="Comentarios, estado..."></textarea>
        </div>

        <div style="margin-bottom:8px">
          <label>Imagen (subir o pegar URL)</label>
          <div class="uploader">
            <label class="fakefile" id="fakefile">Seleccionar imagen</label>
            <input id="file" type="file" accept="image/*" />
            <input id="imgurl" type="url" placeholder="Pegar URL de imagen (opcional)" />
          </div>
          <div id="preview" style="margin-top:8px"></div>
        </div>

        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <button id="btn-cancel" class="btn">Cancelar</button>
          <button id="btn-save" class="btn primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <input id="import-file" type="file" accept="application/json" style="display:none" />

  <script>
    // Simple storage + render
    const KEY = 'manga-tracker:v1'
    let items = JSON.parse(localStorage.getItem(KEY) || '[]')
    const grid = document.getElementById('grid')
    const empty = document.getElementById('empty')

    function save(){ localStorage.setItem(KEY, JSON.stringify(items)) }

    function render(){
      grid.innerHTML = ''
      if(items.length === 0){ empty.style.display='block' } else { empty.style.display='none' }
      items.forEach((it, idx)=>{
        const card = document.createElement('article')
        card.className='card'
        card.innerHTML = `
          <div class="top">
            <div class="thumb">${it.image ? '<img src="'+it.image+'" alt="'+escapeHtml(it.title)+'">' : ''}</div>
            <div class="meta">
              <div class="title">${escapeHtml(it.title)}</div>
              <div class="genre">${escapeHtml(it.genre)}</div>
              <div class="last">Últ. capítulo: <strong>${escapeHtml(it.last)}</strong></div>
            </div>
          </div>
          <div class="actions">
            <a class="link" href="${escapeAttr(it.url)}" target="_blank" rel="noopener">Ir a ver →</a>
            <button class="small btn" data-action="edit" data-idx="${idx}">Editar</button>
            <button class="small btn" data-action="del" data-idx="${idx}" style="background:transparent;border:1px solid rgba(255,255,255,0.2);">Borrar</button>
          </div>
        `
        grid.appendChild(card)
      })
    }

    function escapeHtml(s){ if(!s) return ''
      return String(s).replace(/[&<>\"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c] }) }
    function escapeAttr(s){ return s ? s.replace(/"/g,'&quot;') : '' }

    // modal form logic
    const modal = document.getElementById('modal')
    const formTitle = document.getElementById('form-title')
    const fields = ['title','genre','last','url','notes','imgurl']
    const fileInput = document.getElementById('file')
    const fakefile = document.getElementById('fakefile')
    const preview = document.getElementById('preview')
    let editIndex = -1

    document.getElementById('btn-add').addEventListener('click', ()=>openForm())
    document.getElementById('btn-cancel').addEventListener('click', closeForm)
    document.getElementById('btn-save').addEventListener('click', onSave)

    document.getElementById('grid').addEventListener('click', e=>{
      const b = e.target.closest('button')
      if(!b) return
      const act = b.dataset.action
      const idx = Number(b.dataset.idx)
      if(act === 'edit') openForm(idx)
      if(act === 'del') onDelete(idx)
    })

    // file selector
    fakefile.addEventListener('click', ()=> fileInput.click())
    fileInput.addEventListener('change', ()=>{
      const f = fileInput.files[0]
      if(!f) return
      const reader = new FileReader()
      reader.onload = ()=>{
        preview.innerHTML = '<img src="'+reader.result+'" style="max-width:120px;border-radius:6px">'
        document.getElementById('imgurl').value = ''
        preview.dataset.image = reader.result
      }
      reader.readAsDataURL(f)
    })

    // save / edit
    function openForm(idx){
      editIndex = (typeof idx === 'number' && idx >= 0) ? idx : -1
      formTitle.textContent = editIndex >= 0 ? 'Editar manga' : 'Añadir manga'
      fields.forEach(f=> document.getElementById(f).value = '')
      preview.innerHTML = ''
      preview.dataset.image = ''
      if(editIndex >= 0){
        const it = items[editIndex]
        document.getElementById('title').value = it.title
        document.getElementById('genre').value = it.genre
        document.getElementById('last').value = it.last
        document.getElementById('url').value = it.url
        document.getElementById('notes').value = it.notes || ''
        if(it.image){ preview.innerHTML = '<img src="'+it.image+'" style="max-width:120px;border-radius:6px">'; preview.dataset.image = it.image }
      }
      modal.classList.add('open')
    }
    function closeForm(){ modal.classList.remove('open'); fileInput.value = '' }

    function onSave(){
      const title = document.getElementById('title').value.trim()
      if(!title){ alert('El título es obligatorio'); return }
      const genre = document.getElementById('genre').value
      const last = document.getElementById('last').value.trim() || '-'
      const url = document.getElementById('url').value.trim()
      const notes = document.getElementById('notes').value.trim()
      const imgurl = document.getElementById('imgurl').value.trim()
      const image = preview.dataset.image || (imgurl ? imgurl : '')
      const payload = {title,genre,last,url,notes,image}
      if(editIndex >= 0){ items[editIndex] = payload } else { items.push(payload) }
      save(); render(); closeForm()
    }

    function onDelete(idx){
      if(!confirm('¿Borrar este manga?')) return
      items.splice(idx,1); save(); render()
    }

    // export / import
    document.getElementById('btn-export').addEventListener('click', ()=>{
      const data = JSON.stringify(items, null, 2)
      const blob = new Blob([data], {type:'application/json'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = 'mangas.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)
    })

    const importFile = document.getElementById('import-file')
    document.getElementById('btn-import').addEventListener('click', ()=> importFile.click())
    importFile.addEventListener('change', ()=>{
      const f = importFile.files[0]; if(!f) return
      const r = new FileReader(); r.onload = ()=>{
        try{ const parsed = JSON.parse(r.result); if(!Array.isArray(parsed)) throw new Error('Formato incorrecto')
          items = parsed; save(); render(); alert('Importado correctamente')
        }catch(e){ alert('Fichero inválido: '+e.message) }
      }
      r.readAsText(f)
    })

    document.getElementById('imgurl').addEventListener('change', (e)=>{
      const v = e.target.value.trim()
      if(!v) { preview.innerHTML = ''; preview.dataset.image = ''; return }
      preview.innerHTML = '<img src="'+v+'" style="max-width:120px;border-radius:6px">'
      preview.dataset.image = v
    })

    render()
  </script>
</body>
</html>
