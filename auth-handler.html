<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestión de Cuenta – MangaTracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: #0f172a;
        color: #f1f5f9;
        font-family: "Inter", sans-serif;
        text-align: center;
        padding: 40px;
      }
      .box {
        max-width: 420px;
        margin: auto;
        padding: 25px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        color: #94a3b8;
        margin-bottom: 20px;
      }

      /* Estilos para el formulario de reset */
      .input-group {
        text-align: left;
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
        color: #cbd5e1;
      }
      input {
        width: 100%;
        padding: 10px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
        color: white;
        box-sizing: border-box;
      }

      .btn {
        width: 90%;
        margin-top: 10px;
        background: #3b82f6;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        display: inline-block;
        text-decoration: none;
        font-weight: bold;
      }
      .btn:hover {
        background: #2563eb;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1 id="title">Procesando...</h1>
      <p id="status">Por favor espera…</p>

      <div id="reset-form" class="hidden">
        <div class="input-group">
          <label>Nueva contraseña:</label>
          <input
            type="password"
            id="new-password"
            placeholder="Mínimo 6 caracteres"
          />
        </div>
        <div class="input-group">
          <label>Confirmar contraseña:</label>
          <input
            type="password"
            id="confirm-password"
            placeholder="Repite la contraseña"
          />
        </div>
        <button class="btn" id="btn-save">Cambiar contraseña</button>
      </div>

      <div id="action-completed" class="hidden">
        <a class="btn" href="https://woldroj.github.io/Manga-Tracker/"
          >Ir al inicio de sesión</a
        >
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
      import {
        getAuth,
        applyActionCode,
        confirmPasswordReset,
        verifyPasswordResetCode,
      } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBjGHgNC4CHglfh75yMxXYcLMij8aywcQc",
        authDomain: "mangatracker-63f14.firebaseapp.com",
        projectId: "mangatracker-63f14",
        storageBucket: "mangatracker-63f14.firebasestorage.app",
        messagingSenderId: "612200334218",
        appId: "1:612200334218:web:1cd7349bbc61b71ad7fe73",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get("mode");
      const oobCode = urlParams.get("oobCode");

      const titleEl = document.getElementById("title");
      const statusEl = document.getElementById("status");
      const resetForm = document.getElementById("reset-form");
      const actionCompleted = document.getElementById("action-completed");

      // --- LÓGICA DE VERIFICACIÓN DE EMAIL ---
      async function handleVerifyEmail() {
        titleEl.textContent = "Verificando correo...";
        try {
          await applyActionCode(auth, oobCode);
          statusEl.innerHTML =
            "<strong>¡Correo verificado con éxito! 🎉</strong><br>Ya puedes iniciar sesión.";
          actionCompleted.classList.remove("hidden");
        } catch (error) {
          statusEl.innerHTML =
            "<strong>Error ❌</strong><br>El enlace ha expirado o ya ha sido usado.";
          actionCompleted.classList.remove("hidden");
        }
      }

      // --- LÓGICA DE RECUPERACIÓN DE CONTRASEÑA ---
      async function handleResetPassword() {
        titleEl.textContent = "Nueva Contraseña";
        try {
          // Verificar que el código es válido antes de mostrar el formulario
          const email = await verifyPasswordResetCode(auth, oobCode);
          statusEl.textContent = `Restableciendo contraseña para: ${email}`;
          resetForm.classList.remove("hidden");

          document.getElementById("btn-save").onclick = async () => {
            const newPass = document.getElementById("new-password").value;
            const confirmPass =
              document.getElementById("confirm-password").value;

            if (newPass.length < 6) {
              alert("La contraseña debe tener al menos 6 caracteres.");
              return;
            }
            if (newPass !== confirmPass) {
              alert("Las contraseñas no coinciden.");
              return;
            }

            try {
              await confirmPasswordReset(auth, oobCode, newPass);
              resetForm.classList.add("hidden");
              statusEl.innerHTML =
                "<strong>¡Contraseña cambiada! ✅</strong><br>Ya puedes volver a la app e iniciar sesión.";
              actionCompleted.classList.remove("hidden");
            } catch (e) {
              alert("Error al cambiar la contraseña. Reintenta.");
            }
          };
        } catch (error) {
          statusEl.innerHTML =
            "<strong>Error ❌</strong><br>El enlace es inválido o ha caducado.";
          actionCompleted.classList.remove("hidden");
        }
      }

      // --- SELECTOR DE MODO ---
      if (oobCode) {
        if (mode === "verifyEmail") {
          handleVerifyEmail();
        } else if (mode === "resetPassword") {
          handleResetPassword();
        } else {
          statusEl.textContent = "Acción no soportada.";
        }
      } else {
        statusEl.textContent = "Falta el código de acción.";
      }
    </script>
  </body>
</html>
