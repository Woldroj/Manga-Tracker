<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación de correo – MangaTracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        background: #0f172a;
        color: #f1f5f9;
        font-family: 'Inter', sans-serif;
        text-align: center;
        padding: 40px;
    }
    .box {
        max-width: 420px;
        margin: auto;
        padding: 25px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    h1 { font-size: 24px; }
    p { color: #94a3b8; }
    .btn {
        margin-top: 18px;
        background: #3b82f6;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        display: inline-block;
        text-decoration: none;
    }
</style>
</head>
<body>

<div class="box">
    <h1>Verificando correo…</h1>
    <p id="status">Por favor espera…</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBjGHgNC4CHglfh75yMxXYcLMij8aywcQc",
    authDomain: "mangatracker-63f14.firebaseapp.com",
    projectId: "mangatracker-63f14",
    storageBucket: "mangatracker-63f14.firebasestorage.app",
    messagingSenderId: "612200334218",
    appId: "1:612200334218:web:1cd7349bbc61b71ad7fe73",
    measurementId: "G-1VY5WJG76J"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Obtiene la acción de la URL
const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode');
const oobCode = urlParams.get('oobCode');
const statusEl = document.getElementById('status');

async function verifyEmail() {
    try {
        await applyActionCode(auth, oobCode);
        statusEl.innerHTML = `
            <strong>¡Correo verificado con éxito! 🎉</strong><br><br>
            Ya puedes iniciar sesión en la aplicación.
            <br><br>
            <a class="btn" href="https://woldroj.github.io/Manga-Tracker/">Ir a la app</a>
        `;
    } catch (error) {
        console.error(error);
        statusEl.innerHTML = `
            <strong>Error al verificar el correo ❌</strong><br><br>
            Puede que el enlace haya expirado o ya haya sido usado.<br><br>
            <a class="btn" href="https://woldroj.github.io/Manga-Tracker/">Volver</a>
        `;
    }
}

if (mode === "verifyEmail") {
    verifyEmail();
} else {
    statusEl.textContent = "Acción desconocida.";
}
</script>

</body>
</html>
