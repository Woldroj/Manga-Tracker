<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manga Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --card:#1e293b; --accent:#f1f5f9; --accent-2:#3b82f6; --muted:#94a3b8;
    }
    /* Theme variables are updated via [data-theme] attribute on body */
    body { margin:0; padding:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--accent); transition: background .25s,color .25s; }
    .app{max-width:1100px;margin:24px auto;padding:16px}
    /* ---------- HEADER ---------- */
    header.app-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand h1{ margin:0; font-size:22px; font-weight:700; }
    .profile-area{ display:flex; align-items:center; gap:10px; position:relative; }
    .profile-pic{ width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#2563eb); overflow:hidden; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border:2px solid rgba(255,255,255,0.06); }
    .profile-pic img{ width:100%; height:100%; object-fit:cover; display:block; }
    .user-name{ font-weight:600; font-size:15px; color:var(--accent); }
    .gear-btn{ background:transparent; border:0; color:var(--accent); cursor:pointer; padding:8px; font-size:18px; }
    /* ---------- SETTINGS MENU ---------- */
    .settings-menu{ position:absolute; right:0; top:56px; background:var(--card); border-radius:10px; padding:10px; box-shadow:0 8px 24px rgba(0,0,0,.45); min-width:220px; display:none; z-index:1200; }
    .settings-menu.open{ display:block; }
    .settings-item{ display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; color:var(--accent); }
    .settings-item:hover{ background: rgba(255,255,255,0.03); }
    .settings-item small{ color:var(--muted); font-size:12px; margin-left:auto; }
    .theme-grid{ display:flex; gap:8px; flex-wrap:wrap; padding-top:8px; }
    .theme-swatch{ width:28px; height:28px; border-radius:6px; cursor:pointer; border:2px solid rgba(255,255,255,0.06); }
    .hidden{ display:none; }

    /* ---------- GRID & CARDS (mantengo tu estilo) ---------- */
    .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .controls input,.controls button,.controls select{padding:8px 12px;border-radius:8px;border:none;font-size:14px}
    .controls input,.controls select{background:var(--card);color:var(--accent)}
    .btn.primary{background:var(--accent-2);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px}
    .card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;transition:transform .18s}
    .card .thumb{width:100%;height:140px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .card .meta{padding:12px;display:flex;flex-direction:column;gap:4px}
    .card .actions{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid rgba(255,255,255,0.06)}
    #empty{ color:var(--muted); text-align:center; margin-top:18px; }

    /* ---------- MOBILE BOTTOM BAR ---------- */
    .mobile-bar{ display:none; position:fixed; left:12px; right:12px; bottom:14px; height:60px; background:var(--card); border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.45); z-index:1400; align-items:center; justify-content:space-around; padding:0 16px; }
    .mobile-btn{ background:transparent; border:0; color:var(--accent); font-size:18px; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .mobile-add{ width:56px; height:56px; border-radius:50%; background:var(--accent-2); color:white; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.35); transform:translateY(-6px); font-size:26px; border:4px solid rgba(255,255,255,0.03); }

    /* ---------- MODAL STUFF (reused) ---------- */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);padding:20px;z-index:999}
    .modal.open{display:flex}
    .panel{width:100%;max-width:560px;background:var(--card);border-radius:14px;padding:20px}

    /* Responsive */
    @media(max-width:720px){
      header.app-header{ flex-direction:row; gap:10px; }
      .brand h1{ font-size:18px; }
    }
    @media(max-width:520px){
      .mobile-bar{ display:flex; }
      .app{ padding-bottom:100px; } /* espacio para barra */
    }

    /* ---------- THEME STYLES (base) ---------- */
    /* We'll override CSS variables via JS by toggling body.dataset.theme */
    /* Provide fallback accessible styles for themes */
    /* Define default variables for dark theme (already in :root) */
    /* End styles */
  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1>Manga Tracker</h1>
        <div style="color:var(--muted);font-size:13px;">Registra mangas, animes y series</div>
      </div>

      <div class="profile-area" id="profile-area">
        <div class="profile-pic" id="profile-pic" title="Ver perfil / ajustes">
          <img id="profile-img" src="" alt="avatar" style="display:none">
          <span id="profile-initial" style="font-weight:700;color:white"></span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;margin-left:6px;">
          <div class="user-name" id="user-display">Invitado</div>
        </div>

        <button class="gear-btn" id="gear-btn" title="Ajustes">⚙️</button>

        <div class="settings-menu" id="settings-menu" aria-hidden="true">
          <div class="settings-item" id="s-change-name"><span>✏️</span><div>Cambiar nombre</div></div>
          <div class="settings-item" id="s-change-photo"><span>🖼️</span><div>Cambiar foto de perfil</div></div>
          <div style="padding-top:8px;color:var(--muted);font-size:13px;padding-bottom:6px;">🎨 Temas</div>
          <div class="theme-grid" id="theme-grid">
            <!-- swatches inserted by JS -->
          </div>
          <div class="settings-item" id="s-signout"><span>🚪</span><div>Cerrar sesión</div></div>
        </div>
      </div>
    </header>

    <!-- auth controls (login/register) -->
    <div class="controls" id="auth-controls">
      <input type="text" id="username" placeholder="Nombre de usuario">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login" class="btn primary">Login / Register</button>
    </div>

    <!-- main controls that show when logged in -->
    <div class="controls" id="user-controls" style="display:none">
      <button id="btn-add" class="btn primary">＋ Añadir</button>
    </div>

    <main>
      <section class="grid" id="grid"></section>
      <p id="empty" style="color:var(--muted);text-align:center;">No hay elementos. Pulsa <strong>＋ Añadir</strong> para crear uno.</p>
    </main>
  </div>

  <!-- bottom mobile bar -->
  <div class="mobile-bar" id="mobile-bar" aria-hidden="true">
    <button class="mobile-btn" id="mobile-profile" title="Perfil">👤</button>
    <button class="mobile-add" id="mobile-add" title="Añadir">＋</button>
    <button class="mobile-btn" id="mobile-gear" title="Ajustes">⚙️</button>
  </div>

  <!-- hidden inputs -->
  <input id="file-photo" type="file" accept="image/*" class="hidden">

  <!-- modal template (reuse your existing modal or keep both) -->
  <div class="modal" id="modal">
    <div class="panel">
      <h3 id="form-title">Añadir</h3>
      <!-- form content (re-use your fields) -->
      <div>
        <div class="form-row">
          <div class="col"><label for="type">Tipo</label><select id="type"><option>Manga</option><option>Anime</option><option>Serie</option></select></div>
          <div class="col"><label for="genre">Categoría</label><select id="genre"></select></div>
        </div>
        <div class="form-row">
          <div class="col"><label for="title">Título</label><input id="title" type="text" placeholder="Ej: One Piece"></div>
          <div class="col"><label for="last">Último capítulo / episodio</label><input id="last" type="text" placeholder="Ej: 120"></div>
        </div>
        <div class="form-row">
          <div class="col"><label for="url">Enlace</label><input id="url" type="url" placeholder="https://..."></div>
        </div>
        <div style="margin-bottom:12px;"><label for="notes">Notas (opcional)</label><textarea id="notes" placeholder="Comentarios, estado..."></textarea></div>
        <div style="margin-bottom:10px;"><label>Imagen</label><div class="uploader"><label class="fakefile" id="fakefile">Seleccionar imagen</label><input id="file" type="file" accept="image/*"><input id="imgurl" type="url" placeholder="Pegar URL de imagen (opcional)"></div><div id="preview"></div></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;"><button id="btn-cancel" class="btn">Cancelar</button><button id="btn-save" class="btn primary">Guardar</button></div>
      </div>
    </div>
  </div>

<script type="module">
/* =========================
   Firebase + App logic
   ========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjGHgNC4CHglfh75yMxXYcLMij8aywcQc",
  authDomain: "mangatracker-63f14.firebaseapp.com",
  projectId: "mangatracker-63f14",
  storageBucket: "mangatracker-63f14.firebasestorage.app",
  messagingSenderId: "612200334218",
  appId: "1:612200334218:web:1cd7349bbc61b71ad7fe73",
  measurementId: "G-1VY5WJG76J"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- DOM refs ---------- */
const authControls = document.getElementById('auth-controls');
const userControls = document.getElementById('user-controls');
const userDisplay = document.getElementById('user-display');
const profilePic = document.getElementById('profile-pic');
const profileImg = document.getElementById('profile-img');
const profileInitial = document.getElementById('profile-initial');
const gearBtn = document.getElementById('gear-btn');
const settingsMenu = document.getElementById('settings-menu');
const sChangeName = document.getElementById('s-change-name');
const sChangePhoto = document.getElementById('s-change-photo');
const sSignout = document.getElementById('s-signout');
const themeGrid = document.getElementById('theme-grid');

const btnLogin = document.getElementById('btn-login');
const btnAdd = document.getElementById('btn-add');
const btnSave = document.getElementById('btn-save');
const btnCancel = document.getElementById('btn-cancel');

const mobileBar = document.getElementById('mobile-bar');
const mobileAdd = document.getElementById('mobile-add');
const mobileGear = document.getElementById('mobile-gear');
const mobileProfile = document.getElementById('mobile-profile');
const filePhotoInput = document.getElementById('file-photo');

const gridEl = document.getElementById('grid');
const empty = document.getElementById('empty');

/* ---------- Themes definition (predefined) ---------- */
const THEMES = {
  dark: { '--bg':'#0f172a','--card':'#1e293b','--accent':'#f1f5f9','--accent-2':'#3b82f6','--muted':'#94a3b8' },
  light: { '--bg':'#ffffff','--card':'#f8fafc','--accent':'#0f172a','--accent-2':'#2563eb','--muted':'#6b7280' },
  pink: { '--bg':'#fff0f6','--card':'#fff1f2','--accent':'#2b2a2a','--accent-2':'#ec4899','--muted':'#7c4a5b' },
  blue: { '--bg':'#eff6ff','--card':'#e0f2fe','--accent':'#0b1220','--accent-2':'#3b82f6','--muted':'#64748b' },
  purple: { '--bg':'#faf5ff','--card':'#f3e8ff','--accent':'#211634','--accent-2':'#7c3aed','--muted':'#6b5b7a' },
  green: { '--bg':'#f0fdf4','--card':'#dcfce7','--accent':'#04260f','--accent-2':'#10b981','--muted':'#4b6b53' }
};

/* Insert theme swatches */
Object.keys(THEMES).forEach(key=>{
  const sw = document.createElement('div');
  sw.className='theme-swatch';
  const vars = THEMES[key];
  sw.style.background = vars['--accent-2']; // show accent
  sw.title = key;
  sw.dataset.theme = key;
  sw.addEventListener('click', ()=> applyTheme(key, true));
  themeGrid.appendChild(sw);
});

/* ---------- Helpers: apply theme to document (and optionally save) ---------- */
function setCssVarsFromTheme(themeKey){
  const vars = THEMES[themeKey] || THEMES.dark;
  Object.entries(vars).forEach(([k,v])=>{
    document.documentElement.style.setProperty(k,v);
  });
}
function applyTheme(themeKey, save=true){
  document.body.dataset.theme = themeKey;
  setCssVarsFromTheme(themeKey);
  // store
  if(currentUser){
    const prefsRef = doc(db,'users',currentUser.uid,'prefs','ui');
    setDoc(prefsRef, { theme: themeKey }, { merge:true }).catch(e=>console.error(e));
  } else {
    localStorage.setItem('mt_theme', themeKey);
  }
}

/* ---------- Load saved prefs for user or local ---------- */
async function loadPrefsForUser(uid){
  try{
    const prefsRef = doc(db,'users',uid,'prefs','ui');
    const snap = await getDoc(prefsRef);
    if(snap.exists()){
      const data = snap.data();
      if(data.theme) applyTheme(data.theme, false);
      if(data.photoURL) setProfileImage(data.photoURL);
    } else {
      // fallback to local
      const local = localStorage.getItem('mt_theme') || 'dark';
      applyTheme(local, false);
    }
  }catch(e){ console.error(e); }
}

/* Profile UI helpers */
function setProfileImage(url){
  if(url){
    profileImg.src = url;
    profileImg.style.display = 'block';
    profileInitial.style.display = 'none';
  } else {
    profileImg.style.display = 'none';
    profileInitial.style.display = 'inline-block';
  }
}
function setUserNameDisplay(name){
  userDisplay.textContent = name || 'Invitado';
  profileInitial.textContent = (name && name[0]) ? name[0].toUpperCase() : 'I';
}

/* ---------- AUTH flow ---------- */
let currentUser = null;

btnLogin.addEventListener('click', async ()=>{
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const username = (document.getElementById('username').value || 'Usuario').trim();
  try{
    const uc = await signInWithEmailAndPassword(auth, email, password);
    // if login success, ensure displayName
    if(!uc.user.displayName){
      await updateProfile(uc.user, { displayName: username });
    }
  }catch(err){
    // create account
    const created = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(created.user, { displayName: username });
    // after registering, you might want to send verification etc (you already implemented)
    alert('Cuenta creada. Verifica tu email si tu flujo lo requiere.');
    await signOut(auth);
  }
});

btnAdd.addEventListener('click', ()=> openForm());
mobileAdd.addEventListener('click', ()=> openForm());

btnCancel.addEventListener('click', ()=> closeForm());

gearBtn.addEventListener('click', (e)=>{
  settingsMenu.classList.toggle('open');
  settingsMenu.setAttribute('aria-hidden', settingsMenu.classList.contains('open') ? 'false' : 'true');
});
/* Close settings when clicking outside */
document.addEventListener('click', (e)=>{
  if(!settingsMenu.contains(e.target) && !gearBtn.contains(e.target)){
    settingsMenu.classList.remove('open');
  }
});

/* Settings actions */
sSignout.addEventListener('click', async ()=>{
  await signOut(auth);
  settingsMenu.classList.remove('open');
});
sChangeName.addEventListener('click', async ()=>{
  const newName = prompt('Nuevo nombre:','');
  if(!newName) return;
  try{
    await updateProfile(auth.currentUser, { displayName: newName });
    // store in Firestore user doc if you like:
    const userDoc = doc(db,'users',currentUser.uid);
    await setDoc(userDoc, { displayName:newName }, { merge:true });
    setUserNameDisplay(newName);
    settingsMenu.classList.remove('open');
    alert('Nombre actualizado');
  }catch(e){ console.error(e); alert('Error actualizando nombre'); }
});

/* Change photo (desktop only) */
sChangePhoto.addEventListener('click', ()=>{
  filePhotoInput.click();
  settingsMenu.classList.remove('open');
});
filePhotoInput.addEventListener('change', ()=>{
  const f = filePhotoInput.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = async ()=> {
    const dataUrl = reader.result;
    try{
      await updateProfile(auth.currentUser, { photoURL: dataUrl });
      // save to prefs doc
      const prefsRef = doc(db,'users',currentUser.uid,'prefs','ui');
      await setDoc(prefsRef, { photoURL: dataUrl }, { merge:true });
      setProfileImage(dataUrl);
      alert('Foto actualizada');
    }catch(e){ console.error(e); alert('Error al subir foto'); }
  };
  reader.readAsDataURL(f);
});

/* Mobile gear: opens same menu but hide changePhoto */
mobileGear.addEventListener('click', ()=>{
  if(window.innerWidth <= 520){
    // show a condensed menu: change name, change theme, sign out
    const mobileMenuHtml = `
      <div style="padding:12px;min-width:240px;">
        <div style="margin-bottom:8px;font-weight:600">Ajustes</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button id="mb-change-name" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--accent);">✏ Cambiar nombre</button>
          <div style="display:flex;gap:8px;flex-wrap:wrap;" id="mb-theme-grid"></div>
          <button id="mb-signout" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--accent);">🚪 Cerrar sesión</button>
          <button id="mb-close" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--accent);">Cerrar</button>
        </div>
      </div>`;
    const container = document.createElement('div');
    container.style.position='fixed';
    container.style.left='12px'; container.style.right='12px'; container.style.bottom='90px';
    container.style.zIndex='2000'; container.style.background='var(--card)'; container.style.padding='12px'; container.style.borderRadius='12px'; container.innerHTML = mobileMenuHtml;
    document.body.appendChild(container);

    // fill themes
    const mbGrid = container.querySelector('#mb-theme-grid');
    Object.keys(THEMES).forEach(k=>{
      const b = document.createElement('div');
      b.style.width='30px'; b.style.height='30px'; b.style.borderRadius='6px'; b.style.background = THEMES[k]['--accent-2'];
      b.style.cursor='pointer';
      b.addEventListener('click', ()=>{ applyTheme(k,true); container.remove(); });
      mbGrid.appendChild(b);
    });

    container.querySelector('#mb-change-name').addEventListener('click', async ()=>{
      const newName = prompt('Nuevo nombre:','');
      if(!newName) return;
      try{
        await updateProfile(auth.currentUser, { displayName: newName });
        const userDoc = doc(db,'users',currentUser.uid);
        await setDoc(userDoc, { displayName:newName }, { merge:true });
        setUserNameDisplay(newName);
        container.remove();
      }catch(e){ console.error(e); alert('Error'); }
    });
    container.querySelector('#mb-signout').addEventListener('click', async ()=>{ await signOut(auth); container.remove(); });
    container.querySelector('#mb-close').addEventListener('click', ()=> container.remove());
  }
});

/* Mobile profile click -> show user info or open settings */
mobileProfile.addEventListener('click', ()=>{
  alert('Perfil: ' + (currentUser ? (currentUser.displayName || currentUser.email) : 'Invitado'));
});

/* ---------- Load and render cards (kept simple, uses your existing Firestore structure) ---------- */
async function loadMangas(){
  gridEl.innerHTML = '';
  if(!currentUser) return;
  const col = collection(db,'users',currentUser.uid,'mangas');
  const snap = await getDocs(col);
  const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(items.length === 0){ empty.style.display='block'; return; }
  empty.style.display='none';
  const tipos = ['Manga','Anime','Serie'];
  tipos.forEach(tipo=>{
    const itemsTipo = items.filter(it=>it.type === tipo);
    if(itemsTipo.length === 0) return;
    const header = document.createElement('h2');
    header.className='tipo-header';
    header.textContent = tipo;
    header.style.gridColumn = '1 / -1';
    gridEl.appendChild(header);
    itemsTipo.forEach(it=>{
      const card = document.createElement('article');
      card.className='card';
      card.innerHTML = `
        <div class="thumb">${it.imgurl?'<img src="'+it.imgurl+'" style="width:100%;height:100%;object-fit:cover">':''}</div>
        <div class="meta">
          <div class="title">${it.title}</div>
          <div class="genre">${it.genre}</div>
          <div class="last">Últ.: <strong>${it.last}</strong></div>
        </div>
        <div class="actions">
          <a class="link" href="${it.url || '#'}" target="_blank">Ir a ver →</a>
          <div style="display:flex;gap:6px;">
            <button class="small btn edit-btn" data-id="${it.id}">Editar</button>
            <button class="small btn del-btn" data-id="${it.id}" style="background:transparent;border:1px solid rgba(255,255,255,0.12)">Borrar</button>
          </div>
        </div>`;
      gridEl.appendChild(card);
    });
  });
  // wire up buttons
  gridEl.querySelectorAll('.edit-btn').forEach(b=> b.addEventListener('click', (e)=> { e.stopPropagation(); openForm(b.dataset.id); }));
  gridEl.querySelectorAll('.del-btn').forEach(b=> b.addEventListener('click', async (e)=> { e.stopPropagation(); if(confirm('¿Eliminar?')){ await deleteDoc(doc(db,'users',currentUser.uid,'mangas',b.dataset.id)); loadMangas(); } }));
}

/* ---------- Open/close form (reuse your modal) ---------- */
let editId = null;
const fields = ['title','genre','last','url','notes','imgurl','type'];
const typeSelect = document.getElementById('type');
const genreSelect = document.getElementById('genre');

const categories = {
  Manga:['Acción','Aventura','Comedia','Drama','Fantasía','Romance','Seinen','Shonen','Otro'],
  Anime:['Acción','Aventura','Comedia','Drama','Fantasía','Romance','Slice of Life','Mecha','Isekai','Otro'],
  Serie:['Acción','Drama','Comedia','Thriller','Ciencia Ficción','Fantasía','Misterio','Otro']
};
function updateGenres(){ const list = categories[typeSelect.value]; genreSelect.innerHTML=''; list.forEach(c=>{ const o=document.createElement('option'); o.value=o.textContent=c; genreSelect.appendChild(o); }); }
updateGenres(); typeSelect.addEventListener('change', updateGenres);

function openForm(id=null){
  editId = id;
  document.getElementById('form-title').textContent = id ? 'Editar' : 'Añadir';
  fields.forEach(f=> document.getElementById(f).value = '');
  document.getElementById('preview').innerHTML = ''; document.getElementById('preview').dataset.image = '';
  if(id){
    getDocs(collection(db,'users',currentUser.uid,'mangas')).then(snapshot=>{
      const d = snapshot.docs.find(doc=>doc.id===id).data();
      document.getElementById('title').value = d.title;
      document.getElementById('last').value = d.last;
      document.getElementById('url').value = d.url;
      document.getElementById('notes').value = d.notes || '';
      document.getElementById('type').value = d.type;
      updateGenres();
      document.getElementById('genre').value = d.genre;
      if(d.imgurl){ document.getElementById('preview').innerHTML = `<img src="${d.imgurl}" style="max-width:120px;border-radius:6px">`; document.getElementById('preview').dataset.image = d.imgurl; }
    });
  }
  document.getElementById('modal').classList.add('open');
}
function closeForm(){ document.getElementById('modal').classList.remove('open'); document.getElementById('file').value = ''; editId = null; }

document.getElementById('fakefile').addEventListener('click', ()=> document.getElementById('file').click());
document.getElementById('file').addEventListener('change', ()=> {
  const f = document.getElementById('file').files[0]; if(!f) return; const reader = new FileReader(); reader.onload = ()=> { document.getElementById('preview').innerHTML = `<img src="${reader.result}" style="max-width:120px;border-radius:6px">`; document.getElementById('preview').dataset.image = reader.result; document.getElementById('imgurl').value = ''; }; reader.readAsDataURL(f);
});
document.getElementById('imgurl').addEventListener('change', e=>{ const v = e.target.value.trim(); document.getElementById('preview').dataset.image = v; document.getElementById('preview').innerHTML = v?`<img src="${v}" style="max-width:120px;border-radius:6px">` : ''; });

document.getElementById('btn-save').addEventListener('click', async ()=>{
  if(!currentUser){ alert('Debes iniciar sesión antes de guardar.'); return; }
  const data = {}; fields.forEach(f=> data[f] = document.getElementById(f).value );
  data.imgurl = document.getElementById('preview').dataset.image || '';
  const col = collection(db,'users',currentUser.uid,'mangas');
  if(editId) { await setDoc(doc(db,'users',currentUser.uid,'mangas',editId), data); }
  else { await addDoc(col, data); }
  closeForm(); loadMangas();
});

/* ---------- Auth state change: show/hide UI & load prefs/cards ---------- */
onAuthStateChanged(auth, async (user)=>{
  currentUser = user;
  if(user){
    authControls.style.display='none';
    userControls.style.display='flex';
    setUserNameDisplay(user.displayName || user.email);
    // profile pic from auth or prefs
    if(user.photoURL){ setProfileImage(user.photoURL); }
    await loadPrefsForUser(user.uid);
    await loadMangas();
  } else {
    authControls.style.display='flex';
    userControls.style.display='none';
    setUserNameDisplay('Invitado');
    setProfileImage(null);
    gridEl.innerHTML = '';
    empty.style.display='block';
    // apply local theme if present
    const local = localStorage.getItem('mt_theme') || 'dark';
    applyTheme(local,false);
  }
});

/* ---------- On load: apply local theme if any ---------- */
window.addEventListener('load', ()=>{
  const local = localStorage.getItem('mt_theme') || 'dark';
  applyTheme(local,false);
});

/* prevent accidental form closing when clicking inside modal content */
document.getElementById('modal').addEventListener('click', (e)=>{ if(e.target === document.getElementById('modal')) closeForm(); });

</script>
