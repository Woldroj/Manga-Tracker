<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manga Tracker</title>
  <style>
    :root{
      --bg:#1f2937; --card:#374151; --muted:#9ca3af; --accent:#f9fafb;
      --accent-2:#3b82f6; --danger:#ef4444;
      font-synthesis: none;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;color:var(--accent);background:var(--bg);}
    .app{max-width:1100px;margin:28px auto;padding:18px}
    header{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;text-align:center}
    header h1{font-size:32px;margin:0 0 6px}
    header p{color:var(--muted);margin:0;font-size:16px}

    .controls{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
    .btn{background:var(--accent);color:var(--bg);border:none;padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
    .btn.primary{background:var(--accent-2);color:white;border:none}
    .btn.ghost{background:transparent;color:var(--accent-2);border:1px solid var(--accent-2)}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:20px}
    .card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:8px;min-height:180px}
    .card .top{display:flex;gap:10px}
    .thumb{width:68px;height:92px;border-radius:6px;background:linear-gradient(90deg,#6b7280,#374151);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .meta{flex:1}
    .title{font-weight:700;font-size:17px;margin:0}
    .genre{font-size:13px;color:var(--muted);margin-top:4px}
    .last{margin-top:8px;font-size:14px}
    .actions{display:flex;gap:8px;margin-top:auto;align-items:center}
    .link{font-size:13px;color:var(--accent-2);text-decoration:none;margin-right:auto}
    .small{font-size:12px;padding:6px 8px;border-radius:8px;border:none;cursor:pointer}

    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);padding:20px}
    .modal.open{display:flex}
    .panel{width:100%;max-width:560px;background:var(--card);border-radius:12px;padding:16px}
    .form-row{display:flex;gap:8px;margin-bottom:10px}
    .form-row .col{flex:1}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type=text],select,input[type=url],input[type=number],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);font-size:14px;background:var(--bg);color:var(--accent)}
    textarea{resize:vertical;min-height:70px}
    .uploader{display:flex;gap:8px;align-items:center}
    .uploader input[type=file]{display:none}
    .fakefile{padding:8px 10px;border-radius:8px;border:1px dashed rgba(255,255,255,0.3);cursor:pointer;font-size:13px;color:var(--muted)}
    @media (max-width:520px){.form-row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Manga Tracker</h1>
      <p>Registra tus mangas y capítulos leídos</p>
      <div class="controls" id="auth-controls">
        <input type="text" id="username" placeholder="Nombre de usuario" style="padding:6px;border-radius:6px;border:none;width:180px">
        <input type="email" id="email" placeholder="Email" style="padding:6px;border-radius:6px;border:none;width:180px">
        <input type="password" id="password" placeholder="Contraseña" style="padding:6px;border-radius:6px;border:none;width:140px">
        <button id="btn-login" class="btn primary">Login / Register</button>
      </div>
      <div class="controls" id="user-controls" style="display:none">
        <span id="user-display"></span>
        <button id="btn-logout" class="btn ghost">Cerrar sesión</button>
        <button id="btn-add" class="btn primary">＋ Añadir manga</button>
      </div>
    </header>

    <main>
      <section class="grid" id="grid"></section>
      <p id="empty" style="color:var(--muted);text-align:center;">No hay mangas. Pulsa <strong>＋ Añadir manga</strong> para crear uno.</p>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="panel">
      <h3 id="form-title">Añadir manga</h3>
      <div style="margin-top:10px">
        <div class="form-row">
          <div class="col">
            <label for="title">Título</label>
            <input id="title" type="text" placeholder="Ej: One Piece" />
          </div>
          <div class="col">
            <label for="genre">Género</label>
            <select id="genre">
              <option value="Acción">Acción</option>
              <option value="Aventura">Aventura</option>
              <option value="Comedia">Comedia</option>
              <option value="Drama">Drama</option>
              <option value="Fantasía">Fantasía</option>
              <option value="Romance">Romance</option>
              <option value="Erótico">Erótico</option>
              <option value="Seinen">Seinen</option>
              <option value="Shonen">Shonen</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="col">
            <label for="last">Último capítulo visto</label>
            <input id="last" type="text" placeholder="Ej: 120" />
          </div>
          <div class="col">
            <label for="url">Enlace al manga</label>
            <input id="url" type="url" placeholder="https://..." />
          </div>
        </div>
        <div style="margin-bottom:10px">
          <label for="notes">Notas (opcional)</label>
          <textarea id="notes" placeholder="Comentarios, estado..."></textarea>
        </div>
        <div style="margin-bottom:8px">
          <label>Imagen (subir o pegar URL)</label>
          <div class="uploader">
            <label class="fakefile" id="fakefile">Seleccionar imagen</label>
            <input id="file" type="file" accept="image/*" />
            <input id="imgurl" type="url" placeholder="Pegar URL de imagen (opcional)" />
          </div>
          <div id="preview" style="margin-top:8px"></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <button id="btn-cancel" class="btn">Cancelar</button>
          <button id="btn-save" class="btn primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjGHgNC4CHglfh75yMxXYcLMij8aywcQc",
      authDomain: "mangatracker-63f14.firebaseapp.com",
      projectId: "mangatracker-63f14",
      storageBucket: "mangatracker-63f14.firebasestorage.app",
      messagingSenderId: "612200334218",
      appId: "1:612200334218:web:1cd7349bbc61b71ad7fe73",
      measurementId: "G-1VY5WJG76J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    const authControls = document.getElementById('auth-controls');
    const userControls = document.getElementById('user-controls');
    const userDisplay = document.getElementById('user-display');

    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const btnAdd = document.getElementById('btn-add');

    const modal = document.getElementById('modal');
    const btnCancel = document.getElementById('btn-cancel');
    const btnSave = document.getElementById('btn-save');
    const fields = ['title','genre','last','url','notes','imgurl'];
    const fileInput = document.getElementById('file');
    const fakefile = document.getElementById('fakefile');
    const preview = document.getElementById('preview');

    let editId = null;

    btnLogin.addEventListener('click', async ()=>{
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim() || 'Usuario';
      try{
        const userCredential = await signInWithEmailAndPassword(auth,email,password);
        if(!userCredential.user.displayName) await updateProfile(userCredential.user,{displayName: username});
      }catch{
        const userCredential = await createUserWithEmailAndPassword(auth,email,password);
        await updateProfile(userCredential.user,{displayName: username});
      }
    });

    btnLogout.addEventListener('click', ()=>{ signOut(auth) });
    btnAdd.addEventListener('click', ()=>openForm());
    btnCancel.addEventListener('click', ()=>closeForm());

    fakefile.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', ()=>{
      const f = fileInput.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{ preview.innerHTML = '<img src="'+reader.result+'" style="max-width:120px;border-radius:6px">'; preview.dataset.image=reader.result; document.getElementById('imgurl').value=''; };
      reader.readAsDataURL(f);
    });

    document.getElementById('imgurl').addEventListener('change',(e)=>{
      const v=e.target.value.trim(); preview.dataset.image=v; preview.innerHTML=v?'<img src="'+v+'" style="max-width:120px;border-radius:6px">':'';
    });

    onAuthStateChanged(auth,user=>{
      currentUser=user;
      if(user){
        authControls.style.display='none';
        userControls.style.display='flex';
        userDisplay.textContent=user.displayName || user.email;
        loadMangas();
      }else{
        authControls.style.display='flex';
        userControls.style.display='none';
        grid.innerHTML='';
        empty.style.display='block';
      }
    });

    async function loadMangas(){
      grid.innerHTML='';
      const col = collection(db,'users',currentUser.uid,'mangas');
      const snapshot = await getDocs(col);
      const items = snapshot.docs.map(d=>({id:d.id,...d.data()}));
      if(items.length===0){ empty.style.display='block'; return; }
      empty.style.display='none';
      items.forEach(it=>{
        const card=document.createElement('article'); card.className='card';
        card.innerHTML=`<div class="top"><div class="thumb">${it.image?'<img src="'+it.image+'">':''}</div><div class="meta"><div class="title">${it.title}</div><div class="genre">${it.genre}</div><div class="last">Últ. capítulo: <strong>${it.last}</strong></div></div></div><div class="actions"><a class="link" href="${it.url}" target="_blank">Ir a ver →</a><button class="small btn" data-action="edit" data-id="${it.id}">Editar</button><button class="small btn" data-action="del" data-id="${it.id}" style="background:transparent;border:1px solid rgba(255,255,255,0.2);">Borrar</button></div>`;
        grid.appendChild(card);
      });
      grid.querySelectorAll('button').forEach(b=>{
        const action=b.dataset.action;
        const id=b.dataset.id;
        if(action==='edit') b.addEventListener('click',()=>openForm(id));
        if(action==='del') b.addEventListener('click',()=>deleteManga(id));
      });
    }

    function openForm(id=null){
      editId=id;
      document.getElementById('form-title').textContent=id?'Editar manga':'Añadir manga';
      fields.forEach(f=>document.getElementById(f).value='');
      preview.innerHTML=''; preview.dataset.image='';
      if(id){
        getDocs(collection(db,'users',currentUser.uid,'mangas')).then(snapshot=>{
          const d=snapshot.docs.find(doc=>doc.id===id).data();
          document.getElementById('title').value=d.title;
          document.getElementById('genre').value=d.genre;
          document.getElementById('last').value=d.last;
          document.getElementById('url').value=d.url;
          document.getElementById('notes').value=d.notes||'';
          if(d.image){preview.innerHTML='<img src="'+d.image+'" style="max-width:120px;border-radius:6px">'; preview.dataset.image=d.image;}
        });
      }
      modal.classList.add('open');
    }

    function closeForm(){ modal.classList.remove('open'); fileInput.value=''; editId=null; }

    btnSave.addEventListener('click',async ()=>{
      const title=document.getElementById('title').value.trim(); if(!title){alert('El título es obligatorio'); return;}
      const genre=document.getElementById('genre').value;
      const last=document.getElementById('last').value.trim()||'-';
      const url=document.getElementById('url').value.trim();
      const notes=document.getElementById('notes').value.trim();
      const image=preview.dataset.image||'';
      const data={title,genre,last,url,notes,image};
      if(editId){ await setDoc(doc(db,'users',currentUser.uid,'mangas',editId),data); }
      else{ await addDoc(collection(db,'users',currentUser.uid,'mangas'),data); }
      closeForm(); loadMangas();
    });

    async function deleteManga(id){
      if(confirm('¿Borrar este manga?')){
        await deleteDoc(doc(db,'users',currentUser.uid,'mangas',id));
        loadMangas();
      }
    }
  </script>
</body>
</html>
