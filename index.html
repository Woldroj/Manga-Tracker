<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manga Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    :root{
      --bg:#0f172a; --card:#1e293b; --accent:#f1f5f9; --accent-2:#3b82f6; --muted:#94a3b8;
      --shadow: rgba(0,0,0,0.28);
    }

    /* base */
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:var(--accent);-webkit-font-smoothing:antialiased}
    a{color:var(--accent-2);text-decoration:none}
    .app{max-width:1100px;margin:20px auto;padding:18px}

    /* header */
    header.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
    .brand .title{font-size:22px;font-weight:700;margin:0}
    .brand .subtitle{font-size:13px;color:var(--muted)}

    /* profile area */
    .profile-area{display:flex;align-items:center;gap:10px;position:relative}
    .profile-pic{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#2563eb);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid rgba(255,255,255,0.06)}
    .profile-pic img{width:100%;height:100%;object-fit:cover;display:block}
    .profile-initial{font-weight:700;color:white;font-size:16px;user-select:none}
    .user-block{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:110px}
    .user-name{font-weight:600;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px; max-width: 60%;}
    .user-name input{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--accent);padding:6px 8px;border-radius:8px;width:140px;font-weight:600}

    /* gear button */
    .gear-btn{background:transparent;border:0;color:var(--accent);cursor:pointer;padding:8px;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
    .gear-btn svg{width:20px;height:20px;display:block}

    /* settings menu */
    .settings-menu{position:absolute;right:0;top:60px;background:var(--card);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);min-width:240px;display:none;z-index:1200}
    .settings-menu.open{display:block}
    .settings-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;color:var(--accent)}
    .settings-item:hover{background:rgba(255,255,255,0.03)}
    .settings-item .label{flex:1}
    .theme-grid{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
    .theme-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid rgba(255,255,255,0.06)}

    /* controls / inputs */
    .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px; flex-direction:column; align-items: center;}
    .controls input,.controls button,.controls select{padding:8px 12px;border-radius:8px;border:none;font-size:14px;width:50%;}
    .controls input,.controls select{background:var(--card);color:var(--accent)}
    .btn.primary{background:var(--accent-2);color:#fff;border-radius:8px}
    .btn.ghost{background:transparent;border:1px solid var(--accent-2);color:var(--accent-2);border-radius:8px}
    #username{width:50%}

    /* grid & cards */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px}
    .card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 20px var(--shadow);display:flex;flex-direction:column;transition:transform .18s;cursor:default}
    .card:hover{transform:translateY(-4px)}
    .card .thumb{width:100%;height:140px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .card .thumb img{width:100%;height:100%;object-fit:cover}
    .card .meta{padding:12px;display:flex;flex-direction:column;gap:6px}
    .card .title{font-size:18px;font-weight:700;color:var(--accent)}
    .card .genre{font-size:13px;color:var(--muted)}
    .card .last{font-size:14px;color:var(--accent)}
    .card .actions{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.04)}
    .card .link{padding:6px 8px;border-radius:8px;background:transparent;color:var(--accent-2);border:1px solid rgba(59,130,246,0.08);font-weight:600}
    .card .small{font-size:13px;padding:6px 10px;border-radius:8px;border:none;cursor:pointer}

    /* modal & form */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);padding:20px;z-index:999}
    .modal.open{display:flex}
    .panel{width:100%;max-width:560px;background:var(--card);border-radius:14px;padding:18px}
    .form-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
    .form-row .col{flex:1}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type=text],select,input[type=url],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);font-size:14px;background:var(--bg);color:var(--accent)}
    textarea{min-height:80px;resize:vertical}
    .uploader{display:flex;gap:8px;align-items:center}
    .fakefile{padding:8px 10px;border-radius:8px;border:1px dashed rgba(255,255,255,0.12);cursor:pointer;color:var(--muted)}

    /* category header */
    h2.tipo-header{display:flex;align-items:center;font-size:20px;color:var(--accent-2);font-weight:600;margin:20px 0 10px 0;white-space:nowrap}
    h2.tipo-header::after{content:'';flex-grow:1;height:1px;background:var(--accent-2);margin-left:10px;opacity:0.18}

    #empty{color:var(--muted);text-align:center;margin-top:18px}

    /* mobile bottom bar */
    .mobile-bar{display:none;position:fixed;left:12px;right:12px;bottom:14px;height:64px;background:var(--card);border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:1400;align-items:center;justify-content:space-around;padding:0 16px}
    .mobile-btn{background:transparent;border:0;color:var(--accent);font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
    .mobile-add{width:56px;height:56px;border-radius:50%;background:var(--accent-2);color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);transform:translateY(-6px);font-size:26px;border:4px solid rgba(255,255,255,0.03)}

    .small-toast{font-size:13px;color:var(--accent-2);margin-top:6px}

    /* responsive */
    @media(max-width:720px){ .brand .title{font-size:18px} }
    @media(max-width:520px){
      header.app-header{justify-content:center}
      .profile-area{display:none !important} /* hide desktop profile area on mobile */
      .brand{align-items:center}
      .brand .title{text-align:center}
      .brand .subtitle{text-align:center}
      .mobile-bar{display:flex}
      .app{padding-bottom:100px}
      .form-row{flex-direction:column}
      /* hide top add button on mobile */
      #btn-add{display:none !important}
    }
  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="title">Manga Tracker</div>
        <div class="subtitle">Registra mangas, animes y series</div>
      </div>

      <!-- Desktop profile + gear -->
      <div class="profile-area" id="profile-area" aria-hidden="false">
        <div class="profile-pic" id="profile-pic" title="Ver perfil / ajustes">
          <img id="profile-img" src="" alt="avatar" style="display:none">
          <span id="profile-initial" class="profile-initial">I</span>
        </div>

        <div class="user-block">
          <div class="user-name" id="user-name-block">

          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.936c.04-.303.06-.61.06-.936s-.02-.633-.06-.936l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.8 2h-3.6a.5.5 0 0 0-.5.42l-.36 2.54a7.03 7.03 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.303-.06.61-.06.936s.02.633.06.936L2.82 15.56a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.45.34.7.22l2.39-.96c.5.38 1.05.69 1.62.94l.36 2.54c.05.28.28.49.56.49h3.6c.28 0 .51-.21.56-.49l.36-2.54c.57-.25 1.12-.56 1.62-.94l2.39.96c.25.1.55.02.7-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>

        </button>

        <div class="settings-menu" id="settings-menu" aria-hidden="true">
          <div class="settings-item" id="s-change-name" title="Cambiar nombre">
            <!-- pencil -->
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <div class="label">Cambiar nombre</div>
          </div>

          <div class="settings-item" id="s-change-photo" title="Cambiar foto de perfil">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M21 19V7a2 2 0 0 0-2-2h-3.17L13 2H11l-2.83 3H5a2 2 0 0 0-2 2v12h18zM12 9a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
            <input type="file" id="filePhotoInput" accept="image/*" style="display:none">
            <div class="label">Cambiar foto</div>
          </div>

          <div style="padding-top:8px;color:var(--muted);font-size:13px;padding-bottom:6px;">Temas</div>
          <div class="theme-grid" id="theme-grid"></div>

          <div class="settings-item" id="s-signout" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9zM20 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
            <div class="label">Cerrar sesión</div>
          </div>
        </div>
      </div>
    </header>

    <!-- auth controls -->
    <div class="controls" id="auth-controls">
      <input type="text" id="username" placeholder="Nombre de usuario">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login" class="btn primary">Login / Register</button>
    </div>

    <!-- desktop logged controls -->
    <div class="controls" id="user-controls" style="display:none">
      <button id="btn-add" class="btn primary">＋ Añadir</button>

    <main>
      <section class="grid" id="grid"></section>
      <p id="empty" style="color:var(--muted);text-align:center;">No hay elementos. Pulsa <strong>＋ Añadir</strong> para crear uno.</p>
    </main>
  </div>

  <!-- mobile bottom bar -->
  <div class="mobile-bar" id="mobile-bar" aria-hidden="true">
    <button class="mobile-btn" id="mobile-profile" title="Perfil" aria-label="Perfil">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5v2h18v-2c0-2.5-4-5-9-5z"/></svg>
    </button>

    <button class="mobile-add" id="mobile-add" title="Añadir" aria-label="Añadir">＋</button>

    <button class="mobile-btn" id="mobile-gear" title="Ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/></svg>
    </button>
  </div>

  <!-- hidden inputs -->
  <input id="file-photo" type="file" accept="image/*" style="display:none">

  <!-- modal form -->
  <div class="modal" id="modal" role="dialog" aria-hidden="true">
    <div class="panel" role="document">
      <h3 id="form-title">Añadir</h3>
      <div>
        <div class="form-row">
          <div class="col"><label for="type">Tipo</label><select id="type"><option>Manga</option><option>Anime</option><option>Serie</option></select></div>
          <div class="col"><label for="genre">Categoría</label><select id="genre"></select></div>
        </div>
        <div class="form-row">
          <div class="col"><label for="title">Título</label><input id="title" type="text" placeholder="Ej: One Piece"></div>
          <div class="col"><label for="last">Último capítulo / episodio</label><input id="last" type="text" placeholder="Ej: 120"></div>
        </div>
        <div class="form-row">
          <div class="col"><label for="url">Enlace</label><input id="url" type="url" placeholder="https://..."></div>
        </div>

          <label>Imagen</label>

            <label class="fakefile" id="fakefile">Seleccionar imagen</label>

            <input id="imgurl" type="url" placeholder="Pegar URL de imagen (opcional)" style="margin-left:8px;flex:1">

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;">
          <button id="btn-cancel" class="btn">Cancelar</button>
          <button id="btn-save" class="btn primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

<script type="module">
/* =========================
   FIREBASE + APP LOGIC
   ========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc,
  getDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-storage.js";
import { sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";


/* --------- CONFIG --------- */
const firebaseConfig = {
  apiKey: "AIzaSyBjGHgNC4CHglfh75yMxXYcLMij8aywcQc",
  authDomain: "mangatracker-63f14.firebaseapp.com",
  projectId: "mangatracker-63f14",
  storageBucket: "mangatracker-63f14.appspot.com",
  messagingSenderId: "612200334218",
  appId: "1:612200334218:web:1cd7349bbc61b71ad7fe73",
  measurementId: "G-1VY5WJG76J"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ---------- DOM refs ---------- */
const authControls = document.getElementById('auth-controls');
const userControls = document.getElementById('user-controls');
const userDisplay = document.getElementById('user-display');
const profilePic = document.getElementById('profile-pic');
const profileImg = document.getElementById('profile-img');
const profileInitial = document.getElementById('profile-initial');
const gearBtn = document.getElementById('gear-btn');
const settingsMenu = document.getElementById('settings-menu');
const sChangeName = document.getElementById('s-change-name');
const sChangePhoto = document.getElementById('s-change-photo');
const sSignout = document.getElementById('s-signout');
const themeGrid = document.getElementById('theme-grid');

const btnLogin = document.getElementById('btn-login');
const btnAdd = document.getElementById('btn-add');
const btnSave = document.getElementById('btn-save');
const btnCancel = document.getElementById('btn-cancel');

const mobileAdd = document.getElementById('mobile-add');
const mobileGear = document.getElementById('mobile-gear');
const mobileProfile = document.getElementById('mobile-profile');
const filePhotoInput = document.getElementById('file-photo');

const gridEl = document.getElementById('grid');
const empty = document.getElementById('empty');

const modal = document.getElementById('modal');
const preview = document.getElementById('preview');

/* ---------- Themes ---------- */
const THEMES = {
  dark: { '--bg':'#0f172a','--card':'#1e293b','--accent':'#f1f5f9','--accent-2':'#3b82f6','--muted':'#94a3b8' },
  black: { '--bg':'#0f0f0f','--card':'#1a1a1a','--accent':'#f5f5f5','--accent-2':'#888888','--muted':'#5a5a5a' },
  light: { '--bg':'#ffffff','--card':'#f8fafc','--accent':'#0f172a','--accent-2':'#f0f1f5','--muted':'#6b7280' },
  pink: { '--bg':'#fff0f6','--card':'#fff1f2','--accent':'#2b2a2a','--accent-2':'#ec4899','--muted':'#7c4a5b' },
  blue: { '--bg':'#eff6ff','--card':'#e0f2fe','--accent':'#0b1220','--accent-2':'#3b82f6','--muted':'#64748b' },
  purple: { '--bg':'#faf5ff','--card':'#f3e8ff','--accent':'#211634','--accent-2':'#7c3aed','--muted':'#6b5b7a' },
  green: { '--bg':'#f0fdf4','--card':'#dcfce7','--accent':'#04260f','--accent-2':'#10b981','--muted':'#4b6b53' },
  red: { '--bg':'#fff5f5','--card':'#ffe5e5','--accent':'#2a0a0a','--accent-2':'#ef4444','--muted':'#a64b4b' },
  orange: { '--bg':'#fffaf0','--card':'#fff3e0','--accent':'#2b1a00','--accent-2':'#f97316','--muted':'#b36b3b' },
  teal: { '--bg':'#f0fdfa','--card':'#ccfbf1','--accent':'#042f2e','--accent-2':'#14b8a6','--muted':'#4a7c79' },
  yellow: { '--bg':'#fffbeb','--card':'#fef3c7','--accent':'#2b2a00','--accent-2':'#facc15','--muted':'#a68c4b' }
};

/* helper to get prefs doc ref for a user */
function prefsDocRef(uid){
  return doc(db, 'users', uid, 'prefs', 'ui');
}

/* Populate swatches (UI) */
Object.keys(THEMES).forEach(key=>{
  const sw = document.createElement('div');
  sw.className = 'theme-swatch';
  sw.style.background = THEMES[key]['--accent-2'];
  sw.title = key;
  sw.dataset.theme = key;
  sw.addEventListener('click', ()=> applyTheme(key, true));
  themeGrid.appendChild(sw);
});

/* Apply theme to CSS vars */
function setCssVarsFromTheme(themeKey){
  const vars = THEMES[themeKey] || THEMES.dark;
  Object.entries(vars).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
}
async function applyTheme(themeKey, save=true){
  document.body.dataset.theme = themeKey;
  setCssVarsFromTheme(themeKey);
  if(save){
    try{
      if(currentUser){
        const prefsRef = doc(db, 'users', currentUser.uid, 'prefs', 'ui');
        await setDoc(prefsRef, { theme: themeKey }, { merge: true }).catch(e=>console.error(e));
      } else {
        localStorage.setItem('mt_theme', themeKey);
      }
    }catch(e){
      console.error('Error guardando tema:', e);
    }
  }
}

/* Load prefs for user */
async function loadPrefsForUser(uid){
  try{
    const prefsRef = prefsDocRef(uid);
    const snap = await getDoc(prefsRef);
    if(snap && snap.exists()){
      const data = snap.data();
      if(data.theme) applyTheme(data.theme, false);
      if(data.photoURL) setProfileImage(data.photoURL);
    } else {
      // if Firestore has no prefs, fallback to localStorage
      const local = localStorage.getItem('mt_theme') || 'dark';
      applyTheme(local,false);
    }
  }catch(e){ console.error(e); const local = localStorage.getItem('mt_theme') || 'dark'; applyTheme(local,false); }
}

/* Profile helpers */
function setProfileImage(url) { 
  if (url) {

    // Si es base64, NO se le agrega ?t= porque rompe la imagen
    if (url.startsWith("data:image/")) {
      profileImg.src = url;
    } else {
      // Si es una URL normal (ej: Firebase Storage), sí se agrega ?t=
      const safeUrl = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
      profileImg.src = safeUrl;
    }

    profileImg.style.display = "block";
    profileInitial.style.display = "none";

  } else {
    profileImg.style.display = "none";
    profileInitial.style.display = "inline-block";
  }
}

function setUserNameDisplay(name){
  userDisplay.textContent = name || 'Invitado';
  profileInitial.textContent = (name && name[0]) ? name[0].toUpperCase() : 'I';
}

/* ---------- AUTH STATE ---------- */
let currentUser = null;
onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if (user) {
    authControls.style.display = 'none';
    userControls.style.display = 'flex';
    setUserNameDisplay(user.displayName || user.email);

    // ---------------------------
    // 1️⃣ Intentar cargar foto desde Firestore (SIEMPRE)
    // ---------------------------
    const prefsSnap = await getDoc(prefsDocRef(user.uid));
    if (prefsSnap.exists() && prefsSnap.data().photoURL) {
      setProfileImage(prefsSnap.data().photoURL);
    } else if (user.photoURL) {
      // 2️⃣ Si no está en Firestore, usar Auth
      setProfileImage(user.photoURL);
    } else {
      // 3️⃣ Sin foto
      setProfileImage(null);
    }

    // Cargar tema y datos
    await loadPrefsForUser(user.uid);
    await loadMangas();

  } else {
    authControls.style.display = 'flex';
    userControls.style.display = 'none';
    setUserNameDisplay('Invitado');
    setProfileImage(null);
    gridEl.innerHTML = '';
    empty.style.display = 'block';

/* ---------- AUTH: login/register ---------- */
btnLogin.addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const username = (document.getElementById('username').value || 'Usuario').trim();
  if(!email || !password){ alert('Email y contraseña necesarios'); return; }
  try{
    const uc = await signInWithEmailAndPassword(auth,email,password);
    if(!uc.user.displayName) await updateProfile(uc.user,{ displayName: username });
  }catch(err){
    try{
      const created = await createUserWithEmailAndPassword(auth,email,password);
      await updateProfile(created.user,{ displayName: username });
      alert('Cuenta creada correctamente. Inicia sesión.');
      await signOut(auth);
      try {
        await sendEmailVerification(created.user);
        alert('Cuenta creada. Te hemos enviado un email de verificación. Revísalo');
      }catch (verErr) {
        console.warn('No se pudo enviar email de verificación:', verErr);
        alert('Cuenta creada pero no se pudo enviar el email de verificación');
      }
    }catch(e){
      console.error(e);
      if (e.code === 'auth/email-already-in-use') alert('Ese email ya está en uso');
      else if (e.code === 'auth/invalid-email') alert('Email inválido');
      else if (e.code === 'auth/weak-password') alert('Contraseña demasiado débil');
      else alert('Error creando cuenta: ' + (e.message || e.code));
    }
  }
});

/* Change name (desktop inline) */
sChangeName.addEventListener('click', async () => {
  if (!currentUser) {
    alert('Inicia sesión para cambiar el nombre');
    return;
  }

  settingsMenu.classList.remove('open');

  const nameSpan = document.getElementById('user-display');
  if (nameSpan.dataset.editing === '1') return;

  nameSpan.dataset.editing = '1';
  const original = nameSpan.textContent || '';

  const input = document.createElement('input');
  input.type = 'text';
  input.value = original;
  input.placeholder = 'Nuevo nombre';
  input.style.width = '140px';
  input.maxLength = 20; // enforce in input as well

  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    if (ev.key === 'Escape') { input.value = original; input.blur(); }
  });

  input.addEventListener('blur', async () => {

    const newName = input.value.trim();
    delete nameSpan.dataset.editing;
    input.remove();
    nameSpan.style.display = 'inline';

    if (!newName || newName === original) return;

    if (newName.length > 20) {
      alert('El nombre es demasiado largo (máx 20 caracteres)');
      nameSpan.textContent = original;
      return;
    }

    try {
      const user = auth.currentUser || currentUser;
      if (!user) throw new Error("Usuario no disponible");

      // Cambiar nombre en Authentication
      await updateProfile(user, { displayName: newName });

      // Guardar también en Firestore users doc (opcional / facilita consultas)
      await setDoc(doc(db,'users',user.uid), { displayName: newName }, { merge:true });

      // Actualizar UI sin recargar
      nameSpan.textContent = newName;

    } catch (e) {
      console.error(e);
      alert("Error actualizando nombre (vuelve a intentarlo)");
    }
  });

  nameSpan.style.display = 'none';
  nameSpan.parentElement.prepend(input);
  input.focus();
});

// Convierte un archivo a Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);   // devuelve data:image/png;base64,...
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadProfilePhoto(file) {
  try {
    const user = auth.currentUser || currentUser;
    if (!user) throw new Error("No hay usuario autenticado.");

    // 1️⃣ Validación de tamaño
    if (file.size > 3 * 1024 * 1024) {
      throw new Error(`La imagen es demasiado grande (${(file.size/1024/1024).toFixed(2)}MB). Máximo permitido: 3MB.`);
    }

    // 2️⃣ Convertir a Base64
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        if (!reader.result.startsWith("data:image"))
          reject(new Error("El archivo no es una imagen válida."));
        else resolve(reader.result);
      };

      reader.onerror = () => reject(new Error("Error leyendo la imagen."));
      reader.readAsDataURL(file);
    });

    // 3️⃣ Guardar Base64 en Firestore
    await setDoc(prefsDocRef(user.uid), { photoURL: base64 }, { merge: true });

    // 4️⃣ Actualizar UI
    setProfileImage(base64);

    alert("Foto actualizada correctamente.");

  } catch (err) {
    console.error("❌ Error subiendo imagen:", err);
    alert("Error al subir la imagen:\n\n" + err.message);
  }
}


filePhotoInput.addEventListener('change', () => {
  const f = filePhotoInput.files[0];
  if (!f) return;

});

/* load cards from Firestore and render grouped by type */
async function loadMangas(){
  gridEl.innerHTML = '';
  if(!currentUser){ empty.style.display = 'block'; return; }
  const col = collection(db,'users',currentUser.uid,'mangas');
  const snap = await getDocs(col);
  const items = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  if(items.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const tipos = ['Manga','Anime','Serie'];
  tipos.forEach(tipo=>{
    const itemsTipo = items.filter(it=>it.type === tipo);
    if(itemsTipo.length === 0) return;
    const header = document.createElement('h2');
    header.className = 'tipo-header';
    header.textContent = tipo;
    header.style.gridColumn = '1 / -1';
    gridEl.appendChild(header);

    itemsTipo.forEach(it=>{
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.itemId = it.id; // store id
      card.innerHTML = `
        <div class="thumb">${it.imgurl?'<img src="'+it.imgurl+'" style="width:100%;height:100%;object-fit:cover">':''}</div>
        <div class="meta">
          <div class="title">${it.title}</div>
          <div class="genre">${it.genre}</div>
          <div class="last">Últ.: <strong>${it.last || '0'}</strong></div>
          <div class="small-toast" style="display:none"></div>
        </div>
        <div class="actions">
          <a class="link" href="${it.url || '#'}" target="_blank" rel="noopener">Ir a ver →</a>
          <div style="display:flex;gap:6px;">
            <button class="small btn edit-btn" data-id="${it.id}">Editar</button>
            <button class="small btn del-btn" data-id="${it.id}" style="background:transparent;border:1px solid rgba(255,255,255,0.12)">Borrar</button>
          </div>
        </div>`;
      gridEl.appendChild(card);
    });
  });

  // wire up edit/delete buttons (delegation)
  gridEl.querySelectorAll('.edit-btn').forEach(b=> b.addEventListener('click', e=> { e.stopPropagation(); openForm(b.dataset.id); }));
  gridEl.querySelectorAll('.del-btn').forEach(b=> b.addEventListener('click', async e=> { e.stopPropagation(); if(confirm('¿Eliminar?')){ await deleteDoc(doc(db,'users',currentUser.uid,'mangas',b.dataset.id)); loadMangas(); } }));

  // attach click and touch handlers for incrementing episodes (delegated)
  gridEl.querySelectorAll('.card').forEach(card=>{
    // desktop click + shift (single handler)
    card.addEventListener('click', async (e)=>{
      if(e.target.closest('button') || e.target.closest('a')) return;
      if(!currentUser){ alert('Debes iniciar sesión'); return; }
      const id = card.dataset.itemId;
      // fetch latest doc to avoid stale data
      const docRef = doc(db,'users',currentUser.uid,'mangas',id);
      const docSnap = await getDoc(docRef);
      if(!docSnap.exists()){ alert('Elemento no encontrado'); return; }
      const data = docSnap.data();
      let delta = 1;
      if(e.shiftKey){
        const resp = prompt('¿Cuántos capítulos quieres sumar? (número entero)', '1');
        if(!resp) return;
        const n = parseInt(resp);
        if(!Number.isInteger(n) || n<=0){ alert('Número inválido'); return; }
        delta = n;
      }
      const oldVal = Number(data.last) || 0;
      const newVal = oldVal + delta;
      try{
        await updateDoc(docRef, { last: String(newVal) });
        const strongEl = card.querySelector('.last strong');
        if(strongEl) strongEl.textContent = String(newVal);
        const toast = card.querySelector('.small-toast');
        if(toast){ toast.style.display='block'; toast.textContent = (delta===1)?'Has leído 1 capítulo':`Se han añadido ${delta} capítulos`; setTimeout(()=>toast.style.display='none',2000); }
      }catch(err){ console.error(err); alert('Error actualizando'); }
    });

    // long-press for mobile (touch)
    let longTimer = null;
    card.addEventListener('touchstart', (e)=>{
      if(e.target.closest('button') || e.target.closest('a')) return;
      longTimer = setTimeout(async ()=>{
        // long press triggered
        if(!currentUser){ alert('Debes iniciar sesión'); return; }
        const id = card.dataset.itemId;
        const resp = prompt('Mantén pulsado: ¿Cuántos capítulos quieres sumar? (número entero)', '1');
        if(!resp) { return; }
        const n = parseInt(resp);
        if(!Number.isInteger(n) || n<=0){ alert('Número inválido'); return; }
        // update same as above
        const docRef = doc(db,'users',currentUser.uid,'mangas',id);
        const docSnap = await getDoc(docRef);
        if(!docSnap.exists()) return;
        const data = docSnap.data();
        const oldVal = Number(data.last) || 0;
        const newVal = oldVal + n;
        try{
          await updateDoc(docRef, { last: String(newVal) });
          const strongEl = card.querySelector('.last strong');
          if(strongEl) strongEl.textContent = String(newVal);
          const toast = card.querySelector('.small-toast');
          if(toast){ toast.style.display='block'; toast.textContent = `Se han añadido ${n} capítulos`; setTimeout(()=>toast.style.display='none',2000); }
        }catch(err){ console.error(err); alert('Error actualizando'); }
      }, 600); // 600ms long press
    });
    card.addEventListener('touchend', ()=> { if(longTimer) clearTimeout(longTimer); });
    card.addEventListener('touchcancel', ()=> { if(longTimer) clearTimeout(longTimer); });
  });
}

/* ---------- FORM (open/close/save) ---------- */
let editId = null;
function openForm(id=null){
  editId = id;
  document.getElementById('form-title').textContent = id ? 'Editar' : 'Añadir';
  fields.forEach(f=> document.getElementById(f).value = '');
  preview.innerHTML = ''; preview.dataset.image = '';
  if(id){
    // load doc
    getDoc(doc(db,'users',currentUser.uid,'mangas',id)).then(s=>{
      if(!s.exists()) return;
      const d = s.data();
      document.getElementById('title').value = d.title || '';
      document.getElementById('last').value = d.last || '';
      document.getElementById('url').value = d.url || '';
      document.getElementById('type').value = d.type || 'Manga';
      updateGenres();
      document.getElementById('genre').value = d.genre || '';
      if(d.imgurl){ preview.innerHTML = `<img src="${d.imgurl}" style="max-width:120px;border-radius:6px">`; preview.dataset.image = d.imgurl; }
    });
  }
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}
function closeForm(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); document.getElementById('file').value=''; editId = null; }

btnSave.addEventListener('click', async ()=>{
  if(!currentUser){ alert('Debes iniciar sesión antes de guardar.'); return; }
  const data = {};
  fields.forEach(f=> data[f] = document.getElementById(f).value);
  data.imgurl = preview.dataset.image || '';
  const colRef = collection(db,'users',currentUser.uid,'mangas');
  try{
    if(editId) { await setDoc(doc(db,'users',currentUser.uid,'mangas',editId), data); }
    else { await addDoc(colRef, data); }
    closeForm(); loadMangas();
  }catch(e){ console.error(e); alert('Error guardando'); }
});
btnCancel.addEventListener('click', ()=> closeForm());
document.getElementById('fakefile').addEventListener('click', ()=> document.getElementById('file').click());
