<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manga Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #f1f5f9; --accent-2: #3b82f6;
      --muted: #94a3b8; --danger: #ef4444; --shadow: rgba(0,0,0,0.3);
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--accent)}
    .app{max-width:1100px;margin:40px auto;padding:20px}
    header{text-align:center;margin-bottom:30px} header h1{font-size:38px;font-weight:700;margin-bottom:6px} header p{font-size:16px;color:var(--muted);margin:0}
    .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:15px} .controls input,.controls button,.controls select{padding:8px 12px;border-radius:8px;border:none;font-size:14px} .controls input,.controls select{background:var(--card);color:var(--accent)}
    .controls button{cursor:pointer;transition:0.2s} .btn.primary{background:var(--accent-2);color:#fff} .btn.primary:hover{background:#2563eb}
    .btn.ghost{background:transparent;border:1px solid var(--accent-2);color:var(--accent-2)} .btn.ghost:hover{background:var(--accent-2);color:var(--bg)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:25px}
    h2.tipo-header{border-bottom:2px solid var(--accent-2); padding-bottom:4px; margin-top:20px; color:var(--accent-2);}
    .card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 20px var(--shadow);display:flex;flex-direction:column;transition:transform 0.2s,box-shadow 0.2s; cursor: pointer;} /* CAMBIO: cursor pointer para indicar clic */  /* 🔥 CAMBIO */
    .card:hover{transform:translateY(-4px);box-shadow:0 12px 24px var(--shadow)}
    .card .thumb{width:100%;height:140px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s} .card:hover .thumb img{transform:scale(1.05)}
    .card .meta{padding:12px;display:flex;flex-direction:column;gap:4px} .card .title{font-size:18px;font-weight:700;margin:0}
    .card .genre{font-size:13px;color:var(--muted)} .card .last{font-size:14px;margin-top:6px}
    .card .actions{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid rgba(255,255,255,0.1)}
    .card .link{color:var(--accent-2);text-decoration:none;font-size:13px} .card .small{font-size:12px;padding:6px 10px;border-radius:8px;border:none;cursor:pointer;transition:0.2s}
    .card .small:hover{background:var(--accent-2);color:#fff}
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);padding:20px;z-index:999}
    .modal.open{display:flex} .panel{width:100%;max-width:560px;background:var(--card);border-radius:14px;padding:20px}
    .form-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap} .form-row .col{flex:1}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    input[type=text],select,input[type=url],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);font-size:14px;background:var(--bg);color:var(--accent)}
    textarea{resize:vertical;min-height:70px} .uploader{display:flex;gap:8px;align-items:center}
    .uploader input[type=file]{display:none} .fakefile{padding:8px 10px;border-radius:8px;border:1px dashed rgba(255,255,255,0.3);cursor:pointer;font-size:13px;color:var(--muted)}
    h2.tipo-header {
  display: flex;
  align-items: center;
  font-size: 20px;
  color: var(--accent-2);
  font-weight: 600;
  margin: 20px 0 10px 0;
  white-space: nowrap;
}

h2.tipo-header::after {
  content: '';
  flex-grow: 1;
  height: 1px;
  background: var(--accent-2);
  margin-left: 12px;
  margin-left: 10px;
}
    #preview img{max-width:120px;border-radius:8px;margin-top:6px}

    /* CAMBIO: estilo para aviso de sumar muchos capítulos (pequeño toast dentro de la tarjeta) */ /* 🔥 CAMBIO */
    .small-toast { font-size:13px; color:var(--accent-2); margin-top:6px; } /* 🔥 CAMBIO */

    @media(max-width:520px){.form-row{flex-direction:column}.controls{flex-direction:column;align-items:center}.controls input,.controls button,.controls select{width:90%}}
  

  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Manga Tracker</h1>
    <p>Registra tus mangas, animes y series</p>
    <div class="controls" id="auth-controls">
      <input type="text" id="username" placeholder="Nombre de usuario">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-login" class="btn primary">Login / Register</button>
    </div>
    <div class="controls" id="user-controls" style="display:none">
      <!-- CAMBIO: ahora el nombre es un span + icono lápiz SVG en vez del input y botón --> <!-- 🔥 CAMBIO -->
      <span id="user-display" style="font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px;"></span> <!-- 🔥 CAMBIO -->
      <button id="btn-logout" class="btn ghost">Cerrar sesión</button>
      <button id="btn-add" class="btn primary">＋ Añadir</button>

      <!-- ocultamos los controles anteriores (si existen) y los mantuvimos en DOM por compatibilidad --> <!-- 🔥 CAMBIO -->
      <input id="new-username" type="text" placeholder="Nuevo nombre" style="display:none;"> <!-- 🔥 CAMBIO -->
      <button id="btn-change-name" class="btn ghost" style="display:none">Cambiar nombre</button> <!-- 🔥 CAMBIO -->

      <!-- ICONO LÁPIZ SVG (click lo convierte en editable) --> <!-- 🔥 CAMBIO -->
      <button id="btn-edit-name" title="Editar nombre" style="background:transparent;border:none;color:var(--accent-2);cursor:pointer;padding:4px;display:inline-flex;align-items:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.41l-2.34-2.34a1.003 1.003 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
        </svg>
      </button> <!-- 🔥 CAMBIO -->
      <!-- FIN CAMBIO -->
    </div>
  </header>
  <main>
    <section class="grid" id="grid"></section>
    <p id="empty" style="color:var(--muted);text-align:center;">No hay elementos. Pulsa <strong>＋ Añadir</strong> para crear uno.</p>
  </main>
</div>
<div class="modal" id="modal">
  <div class="panel">
    <h3 id="form-title">Añadir</h3>
    <div>
      <div class="form-row">
        <div class="col"><label for="type">Tipo</label><select id="type"><option>Manga</option><option>Anime</option><option>Serie</option></select></div>
        <div class="col"><label for="genre">Categoría</label><select id="genre"></select></div>
      </div>
      <div class="form-row">
        <div class="col"><label for="title">Título</label><input id="title" type="text" placeholder="Ej: One Piece"></div>
        <div class="col"><label for="last">Último capítulo / episodio</label><input id="last" type="text" placeholder="Ej: 120"></div>
      </div>
      <div class="form-row">
        <div class="col"><label for="url">Enlace</label><input id="url" type="url" placeholder="https://..."></div>
      </div>
      <div style="margin-bottom:12px;"><label for="notes">Notas (opcional)</label><textarea id="notes" placeholder="Comentarios, estado..."></textarea></div>
      <div style="margin-bottom:10px;"><label>Imagen</label><div class="uploader"><label class="fakefile" id="fakefile">Seleccionar imagen</label><input id="file" type="file" accept="image/*"><input id="imgurl" type="url" placeholder="Pegar URL de imagen (opcional)"></div><div id="preview"></div></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;"><button id="btn-cancel" class="btn">Cancelar</button><button id="btn-save" class="btn primary">Guardar</button></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js"; // 🔥 CAMBIO: import updateDoc to update single fields

const firebaseConfig = { apiKey: "AIzaSyBjGHgNC4CHglfh75yMxXYcLMij8aywcQc", authDomain: "mangatracker-63f14.firebaseapp.com", projectId: "mangatracker-63f14", storageBucket: "mangatracker-63f14.firebasestorage.app", messagingSenderId: "612200334218", appId: "1:612200334218:web:1cd7349bbc61b71ad7fe73", measurementId: "G-1VY5WJG76J" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;
const grid=document.getElementById('grid'); 
const empty=document.getElementById('empty');
const authControls=document.getElementById('auth-controls'); 
const userControls=document.getElementById('user-controls'); 
const userDisplay=document.getElementById('user-display');
const btnLogin=document.getElementById('btn-login'); 
const btnLogout=document.getElementById('btn-logout'); 
const btnAdd=document.getElementById('btn-add');
const btnChangeName = document.getElementById("btn-change-name"); // 👈 CAMBIO (se mantiene oculto)
const inputNewName  = document.getElementById("new-username"); // 👈 CAMBIO (se mantiene oculto)
const btnEditName = document.getElementById("btn-edit-name"); // 👈 CAMBIO: nuevo botón lápiz
const modal=document.getElementById('modal'); 
const btnCancel=document.getElementById('btn-cancel'); 
const btnSave=document.getElementById('btn-save');
const fields=['title','genre','last','url','notes','imgurl','type']; 
const fileInput=document.getElementById('file'); 
const fakefile=document.getElementById('fakefile'); 
const preview=document.getElementById('preview');
let editId=null;

const typeSelect = document.getElementById('type'); 
const genreSelect = document.getElementById('genre');
const categories = {
  Manga:['Acción','Aventura','Comedia','Drama','Fantasía','Romance','Seinen','Shonen','Otro'],
  Anime:['Acción','Aventura','Comedia','Drama','Fantasía','Romance','Slice of Life','Mecha','Isekai','Otro'],
  Serie:['Acción','Drama','Comedia','Thriller','Ciencia Ficción','Fantasía','Misterio','Otro']
};

function updateGenres(){ 
  const list = categories[typeSelect.value]; 
  genreSelect.innerHTML=''; 
  list.forEach(c=>{
    const o=document.createElement('option'); 
    o.value=o.textContent=c; 
    genreSelect.appendChild(o); 
  }); 
}
updateGenres(); 
typeSelect.addEventListener('change',updateGenres);

btnLogin.addEventListener('click',async()=>{
  const email=document.getElementById('email').value; 
  const password=document.getElementById('password').value; 
  const username=document.getElementById('username').value.trim()||'Usuario';
  try{
    const userCredential=await signInWithEmailAndPassword(auth,email,password); 
    if(!userCredential.user.displayName) await updateProfile(userCredential.user,{displayName:username}); 
  }
  catch{
    const userCredential=await createUserWithEmailAndPassword(auth,email,password); 
    await updateProfile(userCredential.user,{displayName:username}); 
  }
});
btnLogout.addEventListener('click',()=>signOut(auth));

// CAMBIO: ocultamos los controles antiguos (input+boton) y activamos icono lápiz manejable // 🔥 CAMBIO
btnChangeName.style.display = 'none'; // 🔥 CAMBIO
inputNewName.style.display = 'none'; // 🔥 CAMBIO

// CAMBIO: al hacer click en el lápiz, convertimos el userDisplay en editable // 🔥 CAMBIO
btnEditName.addEventListener('click', () => { // 🔥 CAMBIO
  if (!currentUser) return alert('Inicia sesión para editar tu nombre'); // 🔥 CAMBIO
  userDisplay.contentEditable = 'true'; // 🔥 CAMBIO
  userDisplay.focus(); // 🔥 CAMBIO

  // mover el caret al final (opcional, para mejor UX) // 🔥 CAMBIO
  const range = document.createRange(); // 🔥 CAMBIO
  range.selectNodeContents(userDisplay); // 🔥 CAMBIO
  range.collapse(false); // 🔥 CAMBIO
  const sel = window.getSelection(); // 🔥 CAMBIO
  sel.removeAllRanges(); // 🔥 CAMBIO
  sel.addRange(range); // 🔥 CAMBIO
}); // 🔥 CAMBIO

// CAMBIO: guarda el nombre al perder foco o al pulsar Enter // 🔥 CAMBIO
userDisplay.addEventListener('keydown', async (e) => { // 🔥 CAMBIO
  if (e.key === 'Enter') { // 🔥 CAMBIO
    e.preventDefault(); // 🔥 CAMBIO
    userDisplay.blur(); // 🔥 CAMBIO -> disparará el blur handler que guarda
  } // 🔥 CAMBIO
}); // 🔥 CAMBIO

userDisplay.addEventListener('blur', async () => { // 🔥 CAMBIO
  if (!currentUser) return; // 🔥 CAMBIO
  const newName = userDisplay.textContent.trim(); // 🔥 CAMBIO
  if (!newName) { // 🔥 CAMBIO
    userDisplay.textContent = currentUser.displayName || 'Usuario'; // 🔥 CAMBIO
    userDisplay.contentEditable = 'false'; // 🔥 CAMBIO
    return; // 🔥 CAMBIO
  } // 🔥 CAMBIO

  try { // 🔥 CAMBIO
    await updateProfile(auth.currentUser, { displayName: newName }); // 🔥 CAMBIO
    userDisplay.textContent = newName; // 🔥 CAMBIO
  } catch (err) { // 🔥 CAMBIO
    console.error(err); // 🔥 CAMBIO
    alert('Error al actualizar el nombre'); // 🔥 CAMBIO
  } finally { // 🔥 CAMBIO
    userDisplay.contentEditable = 'false'; // 🔥 CAMBIO
  } // 🔥 CAMBIO
}); // 🔥 CAMBIO

btnAdd.addEventListener('click',()=>openForm()); 
btnCancel.addEventListener('click',()=>closeForm());

fakefile.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{const f=fileInput.files[0]; if(!f)return; const reader=new FileReader(); reader.onload=()=>{ preview.innerHTML='<img src="'+reader.result+'" style="max-width:120px;border-radius:6px">'; preview.dataset.image=reader.result; document.getElementById('imgurl').value=''; }; reader.readAsDataURL(f); });
document.getElementById('imgurl').addEventListener('change',e=>{const v=e.target.value.trim(); preview.dataset.image=v; preview.innerHTML=v?'<img src="'+v+'" style="max-width:120px;border-radius:6px">':''; });

onAuthStateChanged(auth,user=>{
  currentUser=user; 
  if(user){ 
    authControls.style.display='none'; 
    userControls.style.display='flex'; 
    userDisplay.textContent=user.displayName||'Usuario'; 
    loadMangas(); 
  }
  else{ 
    authControls.style.display='flex'; 
    userControls.style.display='none'; 
    grid.innerHTML=''; 
    empty.style.display='block'; 
  }
});

async function loadMangas(){
  grid.innerHTML='';
  const col=collection(db,'users',currentUser.uid,'mangas');
  const snapshot=await getDocs(col);
  const items=snapshot.docs.map(d=>({id:d.id,...d.data()}));
  if(items.length===0){ empty.style.display='block'; return; } 
  empty.style.display='none';

  const tipos = ['Manga','Anime','Serie'];
  tipos.forEach(tipo=>{
    const itemsTipo = items.filter(it=>it.type === tipo);
    if(itemsTipo.length === 0) return;

    const header = document.createElement('h2');
    header.textContent = tipo;
    header.style.gridColumn = '1 / -1';
    header.className='tipo-header';
    grid.appendChild(header);

    itemsTipo.forEach(it=>{
      const card=document.createElement('article');
      card.className='card';

      // CAMBIO: data-id en la tarjeta para referencia fácil y evitar closures problemáticos // 🔥 CAMBIO
      card.dataset.itemId = it.id; // 🔥 CAMBIO

      card.innerHTML=`<div class="thumb">${it.imgurl?'<img src="'+it.imgurl+'">':''}</div>
        <div class="meta">
          <div class="title">${it.title}</div>
          <div class="genre">${it.genre}</div>
          <div class="last">Últ.: <strong>${it.last}</strong></div>
          <div class="small-toast" style="display:none;"></div> <!-- 🔥 CAMBIO: espacio para mensajes puntuales -->
        </div>
        <div class="actions">
          <a class="link" href="${it.url || '#'}" target="_blank">Ir a ver →</a>
          <button class="small btn" data-action="edit" data-id="${it.id}">Editar</button>
          <button class="small btn" data-action="del" data-id="${it.id}" style="background:transparent;border:1px solid rgba(255,255,255,0.2);">Borrar</button>
        </div>`;
      grid.appendChild(card);

      // CAMBIO: manejador de click en la tarjeta (suma 1 o varios con SHIFT) // 🔥 CAMBIO
      card.addEventListener('click', async (e) => {
        // Opción A: solo sumamos si no se ha hecho click en un botón o enlace dentro de la tarjeta
        if (e.target.closest('button') || e.target.closest('a')) return; // 🔥 CAMBIO: evita interferir con botones
        if (!currentUser) { alert('Debes iniciar sesión para actualizar el capítulo'); return; } // 🔥 CAMBIO

        const id = card.dataset.itemId; // 🔥 CAMBIO
        // Buscar el item actual en la lista (para tener el último valor)
        const currentItem = items.find(x => x.id === id); // 🔥 CAMBIO
        if (!currentItem) return; // 🔥 CAMBIO

        let delta = 1; // 🔥 CAMBIO por defecto +1
        if (e.shiftKey) {
          // prompt para sumar varios
          const resp = prompt('¿Cuántos episodios quieres sumar? (número entero)');
          if (!resp) return;
          const n = parseInt(resp);
          if (!Number.isInteger(n) || n <= 0) { alert('Número inválido'); return; }
          delta = n; // 🔥 CAMBIO
        }

        // calcular nuevo valor
        const oldLast = Number(currentItem.last) || 0; // 🔥 CAMBIO
        const newLast = oldLast + delta; // 🔥 CAMBIO

        try {
          // Actualizar sólo el campo 'last' sin sobreescribir otros datos
          await updateDoc(doc(db,'users',currentUser.uid,'mangas',id), { last: String(newLast) }); // 🔥 CAMBIO
          // actualizar UI inmediatamente
          const strongEl = card.querySelector('.last strong'); // 🔥 CAMBIO
          if (strongEl) strongEl.textContent = String(newLast); // 🔥 CAMBIO

          // mostrar toast pequeño temporal
          const toast = card.querySelector('.small-toast'); // 🔥 CAMBIO
          if (toast) {
            toast.style.display = 'block'; // 🔥 CAMBIO
            toast.textContent = (delta === 1) ? 'Has leído 1 capítulo' : `Se han añadido ${delta} capítulos`; // 🔥 CAMBIO
            setTimeout(()=>{ toast.style.display='none'; }, 2200); // 🔥 CAMBIO
          }
          // también actualizamos el objeto items para futuras operaciones sin recargar
          currentItem.last = String(newLast); // 🔥 CAMBIO
        } catch (err) {
          console.error('Error actualizando capítulo:', err); // 🔥 CAMBIO
          alert('No se pudo actualizar el capítulo.'); // 🔥 CAMBIO
        }
      }); // 🔥 CAMBIO

    }); // itemsTipo.forEach
  }); // tipos.forEach

  // reenlazar botones (editar/borrar) como antes
  grid.querySelectorAll('button').forEach(b=>{
    const action=b.dataset.action; 
    const id=b.dataset.id; 
    if(action==='edit') b.addEventListener('click',()=>openForm(id)); 
    if(action==='del') b.addEventListener('click',()=>deleteManga(id));
  });
}

function openForm(id=null){
  editId=id; 
  document.getElementById('form-title').textContent=id?'Editar':'Añadir';
  fields.forEach(f=>document.getElementById(f).value=''); 
  preview.innerHTML=''; 
  preview.dataset.image='';
  if(id){
    getDocs(collection(db,'users',currentUser.uid,'mangas')).then(snapshot=>{
      const d=snapshot.docs.find(doc=>doc.id===id).data(); 
      document.getElementById('title').value=d.title; 
      document.getElementById('genre').value=d.genre; 
      document.getElementById('last').value=d.last; 
      document.getElementById('url').value=d.url; 
      document.getElementById('notes').value=d.notes||''; 
      document.getElementById('type').value=d.type; 
      updateGenres();
      if(d.imgurl){preview.innerHTML='<img src="'+d.imgurl+'" style="max-width:120px;border-radius:6px">'; preview.dataset.image=d.imgurl;} 
    });
  }
  modal.classList.add('open');
}


function closeForm(){ modal.classList.remove('open'); fileInput.value=''; editId=null; }

btnSave.addEventListener('click',async()=>{
  if(!currentUser){ alert('Debes iniciar sesión antes de guardar.'); return; }
  const data={}; 
  fields.forEach(f=>data[f]=document.getElementById(f).value); 
  data.imgurl=preview.dataset.image||'';
  const col=collection(db,'users',currentUser.uid,'mangas');
  if(editId){ await setDoc(doc(db,'users',currentUser.uid,'mangas',editId),data); }
  else{ await addDoc(col,data); }
  closeForm(); loadMangas();
});

async function deleteManga(id){
  if(confirm('¿Eliminar este elemento?')){ 
    await deleteDoc(doc(db,'users',currentUser.uid,'mangas',id)); 
    loadMangas(); 
  }
}
</script>
</body>
</html>
